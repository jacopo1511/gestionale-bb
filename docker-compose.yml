# Deploy "tutto su Unraid" — app + database + tunnel Cloudflare.
# Copia .env.docker.example in .env.docker e compila i valori, poi:
#   docker compose --env-file .env.docker up -d --build

services:
  db:
    image: postgres:16-bookworm
    container_name: gestionale-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DB_DATA_DIR:-./.data/db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestionale-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      APP_SECRET: ${APP_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      DOCUMENTS_DIR: /data/documenti
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ${DOCUMENTS_DIR:-./.data/documenti}:/data/documenti
    # In sviluppo puoi esporre la porta; in produzione lascia che ci pensi il tunnel.
    ports:
      - "${APP_PORT:-3000}:3000"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: gestionale-tunnel
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
