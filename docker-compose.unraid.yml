# Variante per Unraid: usa l'immagine gia compilata da GitHub (ghcr.io), niente build locale.
# Richiede il plugin "Docker Compose Manager". In alternativa vedi docs/DEPLOY-UNRAID.md
# per creare i 3 container a mano da Docker -> Add Container.
#
#   docker compose -f docker-compose.unraid.yml --env-file .env.docker up -d
#
# In .env.docker imposta APP_IMAGE=ghcr.io/<tuo-utente>/gestionale-bb:latest

services:
  db:
    image: postgres:16-bookworm
    container_name: gestionale-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DB_DATA_DIR:-/mnt/user/appdata/gestionale/db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE}
    container_name: gestionale-app
    restart: unless-stopped
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      APP_SECRET: ${APP_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      DOCUMENTS_DIR: /data/documenti
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ${DOCUMENTS_DIR:-/mnt/user/appdata/gestionale/documenti}:/data/documenti
    ports:
      - "${APP_PORT:-3000}:3000"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: gestionale-tunnel
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    profiles: ["public"]
